<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mixpanel Test</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 600px; 
            margin: 50px auto; 
            padding: 20px;
        }
        button { 
            background: #007bff; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            margin: 10px 0;
            cursor: pointer; 
            border-radius: 5px;
            display: block;
            width: 100%;
        }
        button:hover { background: #0056b3; }
        .log { 
            background: #f8f9fa; 
            padding: 15px; 
            border: 1px solid #dee2e6; 
            border-radius: 5px; 
            margin: 20px 0;
            white-space: pre-wrap;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>Mixpanel Test Page</h1>
    <p>Use this page to test if Mixpanel is working correctly.</p>
    
    <button onclick="testMixpanel()">Send Test Event</button>
    <button onclick="testPageView()">Test Page View</button>
    <button onclick="testIdentify()">Test User Identify</button>
    <button onclick="clearLog()">Clear Log</button>
    
    <div id="log" class="log">Console output will appear here...</div>
    
    <!-- Mixpanel Analytics -->

    <script>
        const logEl = document.getElementById('log');
        
        function log(message) {
            console.log(message);
            logEl.textContent += new Date().toLocaleTimeString() + ': ' + message + '\n';
        }
        
        function clearLog() {
            logEl.textContent = '';
        }
        
        function testMixpanel() {
            log('Testing basic Mixpanel tracking...');
            if (window.mixpanel) {
                mixpanel.track('Test Event', {
                    test: true,
                    timestamp: new Date().toISOString(),
                    source: 'test_page'
                });
                log('✅ Test event sent!');
            } else {
                log('❌ Mixpanel not found');
            }
        }
        
        function testPageView() {
            log('Testing page view tracking...');
            if (window.mixpanel) {
                mixpanel.track('Page Viewed', {
                    page_name: 'Test Page',
                    page_url: window.location.href,
                    page_title: document.title
                });
                log('✅ Page view event sent!');
            } else {
                log('❌ Mixpanel not found');
            }
        }
        
        function testIdentify() {
            log('Testing user identification...');
            if (window.mixpanel) {
                const testUserId = 'test-user-' + Date.now();
                mixpanel.identify(testUserId);
                mixpanel.people.set({
                    '$email': 'test@example.com',
                    '$name': 'Test User',
                    test_account: true
                });
                log('✅ User identified as: ' + testUserId);
            } else {
                log('❌ Mixpanel not found');
            }
        }
        
        // Test on page load
        window.addEventListener('load', function() {
            log('Page loaded. Mixpanel available: ' + (window.mixpanel ? 'YES' : 'NO'));
            if (window.mixpanel) {
                log('Mixpanel instance: ' + typeof window.mixpanel);
                // Send automatic page load event
                testPageView();
            }
        });
    </script>
</body>
</html>
